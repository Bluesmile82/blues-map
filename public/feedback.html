<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Report wrong info — The Blues Map</title>
    <link rel="icon" type="image/svg+xml" href="/blues-icon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#0a0805; --bg2:#0f0c07; --border:#396E7F; --ink:#fff; --ink3:#CBDBBD; --accent:#4c93a9; }
      * { box-sizing: border-box; }
      body { margin:0; padding:2rem 1rem; background:var(--bg); color:var(--ink);
             font-family:'Oswald',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
      main { max-width:640px; margin:0 auto; }
      h1 { font-weight:500; font-size:1.75rem; margin:0 0 .5rem; }
      p.lede { color:var(--ink3); margin:0 0 2rem; line-height:1.6; }
      label { display:block; margin:0 0 1.25rem; font-size:1rem; }
      label > span { display:block; margin-bottom:.4rem; }
      label > span em { color:var(--ink3); font-style:normal; font-size:.85rem; }
      input, textarea { width:100%; padding:.65rem .75rem; background:var(--bg2); color:var(--ink);
                        border:1px solid var(--border); border-radius:6px; font:inherit; font-size:1rem; }
      input:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
      textarea { min-height:6rem; resize:vertical; }
      button { padding:.7rem 1.5rem; background:rgba(76,147,169,.15); color:var(--accent);
               border:1px solid var(--border); border-radius:6px; font:inherit; font-size:1rem; }
      button:hover { background:rgba(76,147,169,.3); }
      a { color:var(--accent); }
      .hp { position:absolute; left:-9999px; }
      #sent { display:none; }
    </style>
  </head>
  <body>
    <main>
      <div id="sent">
        <h1>Thanks!</h1>
        <p class="lede">Your correction is on its way. <a href="/">Back to the map</a></p>
      </div>

      <form id="form" name="musician-feedback" method="POST" action="/feedback.html?sent=1"
            data-netlify="true" data-netlify-recaptcha="true" data-netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="musician-feedback" />
        <p class="hp"><label>Leave this empty: <input name="bot-field" /></label></p>

        <h1>Something wrong?</h1>
        <p class="lede">Tell us what's off about a musician and we'll fix it. Sources help a lot.</p>

        <label><span>Musician</span><input type="text" name="musician" required /></label>
        <label><span>What's wrong?</span><textarea name="whats-wrong" required></textarea></label>
        <label><span>What's the correct info? <em>(optional)</em></span><textarea name="correct-info"></textarea></label>
        <label><span>Sources <em>(links, books, liner notes — optional)</em></span><textarea name="sources"></textarea></label>
        <label><span>Your email <em>(optional, only if you want a reply)</em></span><input type="email" name="email" /></label>

        <div data-netlify-recaptcha="true"></div>
        <p><button type="submit">Send feedback</button></p>
      </form>
    </main>
    <script>
      var p = new URLSearchParams(location.search);
      if (p.get('sent')) { form.style.display = 'none'; sent.style.display = 'block'; }
      if (p.get('musician')) form.musician.value = p.get('musician');
    </script>
  </body>
</html>
